<title>Graylum 施工进度</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  /* 布局：顶部摘要（分段进度条 + 状态筛选），下面按 Master Plan 阶段分组的任务卡片网格，最后是计划外工作 */
  :root {
    --bg: #f5f6f8; --surface: #ffffff; --line: #dde1e8; --fg: #1b2230; --muted: #5d6779;
    --accent: #2f5bd3;
    --done: #1f8a52; --doing: #2f5bd3; --plan: #7a4fc4; --blocked: #b86e00; --todo: #8a93a3; --closed: #a3a9b4;
    --done-bg: #e3f4ea; --doing-bg: #e5ecfb; --plan-bg: #efe8fa; --blocked-bg: #fbefdc; --todo-bg: #eceef2; --closed-bg: #f0f1f3;
    --font-ui: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12151b; --surface: #1a1f28; --line: #2c3340; --fg: #e6e9ef; --muted: #9aa3b2; --accent: #7d9cf0;
      --done: #4cc585; --doing: #7d9cf0; --plan: #b394ec; --blocked: #f0a83c; --todo: #8a93a3; --closed: #6c7380;
      --done-bg: #173325; --doing-bg: #1c2a4a; --plan-bg: #2a2142; --blocked-bg: #3a2a12; --todo-bg: #232833; --closed-bg: #20242c;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12151b; --surface: #1a1f28; --line: #2c3340; --fg: #e6e9ef; --muted: #9aa3b2; --accent: #7d9cf0;
    --done: #4cc585; --doing: #7d9cf0; --plan: #b394ec; --blocked: #f0a83c; --todo: #8a93a3; --closed: #6c7380;
    --done-bg: #173325; --doing-bg: #1c2a4a; --plan-bg: #2a2142; --blocked-bg: #3a2a12; --todo-bg: #232833; --closed-bg: #20242c;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.55 var(--font-ui); }
  .wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 48px; display: grid; gap: 28px; }
  header { display: grid; gap: 14px; }
  h1 { margin: 0; font-size: 1.6rem; letter-spacing: 0.01em; text-wrap: balance; }
  .meta { color: var(--muted); font-size: 0.85rem; }
  .meta code { font-family: var(--font-mono); }
  .summary { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
  .big { font-size: 2.4rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
  .bar { display: flex; height: 12px; border-radius: 6px; overflow: hidden; background: var(--line); }
  .bar span { display: block; height: 100%; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--surface); color: var(--fg); font: inherit; font-size: 0.85rem; cursor: pointer;
  }
  .chip[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .chip:focus-visible, a:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .num { font-variant-numeric: tabular-nums; color: var(--muted); }
  section.phase { display: grid; gap: 12px; }
  .phase-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
  .phase-head h2 { margin: 0; font-size: 1.1rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 290px), 1fr)); gap: 12px; }
  .card {
    min-width: 0; display: grid; gap: 8px; align-content: start; padding: 12px 14px; background: var(--surface);
    border: 1px solid var(--line); border-left: 4px solid var(--status); border-radius: 8px;
  }
  .card-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .name { font-family: var(--font-mono); font-weight: 600; font-size: 0.92rem; overflow-wrap: anywhere; }
  .pill { flex: none; padding: 1px 8px; border-radius: 999px; font-size: 0.78rem; color: var(--status); background: var(--status-bg); font-weight: 600; }
  .reason { color: var(--muted); font-size: 0.85rem; overflow-wrap: anywhere; }
  .row { display: flex; flex-wrap: wrap; gap: 4px 6px; font-size: 0.8rem; align-items: baseline; }
  .label { color: var(--muted); }
  .dep { font-family: var(--font-mono); padding: 0 6px; border-radius: 4px; background: var(--todo-bg); }
  .dep.ok { color: var(--done); background: var(--done-bg); }
  .dep.no { color: var(--blocked); background: var(--blocked-bg); }
  .prs a { color: var(--accent); text-decoration: none; font-variant-numeric: tabular-nums; }
  .prs a:hover { text-decoration: underline; }
  .prs a.open { font-weight: 700; }
  .prs a.closed { color: var(--muted); text-decoration: line-through; }
  details { font-size: 0.82rem; }
  details summary { cursor: pointer; color: var(--muted); }
  details p { margin: 6px 0 0; overflow-wrap: anywhere; }
  .s-已完成 { --status: var(--done); --status-bg: var(--done-bg); }
  .s-实施中 { --status: var(--doing); --status-bg: var(--doing-bg); }
  .s-方案中 { --status: var(--plan); --status-bg: var(--plan-bg); }
  .s-被阻塞 { --status: var(--blocked); --status-bg: var(--blocked-bg); }
  .s-未开始 { --status: var(--todo); --status-bg: var(--todo-bg); }
  .s-已关闭 { --status: var(--closed); --status-bg: var(--closed-bg); }
  .extra { display: grid; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px; }
  .extra h2 { margin: 0; font-size: 1.05rem; }
  .extra ul { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; }
  .extra li { overflow-wrap: anywhere; }
  .extra a { color: var(--accent); }
  .warn { border-color: var(--blocked); }
  .empty { color: var(--muted); font-size: 0.85rem; }
  @media (prefers-reduced-motion: no-preference) { .bar span { transition: width 0.3s ease; } }
</style>

<div class="wrap">
  <header>
    <h1>Graylum 施工进度</h1>
    <div class="meta" id="meta"></div>
    <div class="summary" id="summary"></div>
    <div class="bar" id="bar" role="img"></div>
    <div class="filters" id="filters" aria-label="按状态筛选"></div>
  </header>
  <main id="phases"></main>
  <section class="extra" id="unplanned"></section>
  <section class="extra warn" id="warnings" hidden></section>
</div>

<script type="application/json" id="plan-progress-data">__PLAN_PROGRESS_DATA__</script>
<script>
  (function () {
    var data = JSON.parse(document.getElementById('plan-progress-data').textContent);
    var STATUSES = ['已完成', '实施中', '方案中', '被阻塞', '未开始', '已关闭'];
    var COLORS = { '已完成': '--done', '实施中': '--doing', '方案中': '--plan', '被阻塞': '--blocked', '未开始': '--todo', '已关闭': '--closed' };
    var byName = {};
    data.tasks.forEach(function (t) { byName[t.name] = t; });
    var active = {};
    try { active = JSON.parse(localStorage.getItem('plan-progress-filter') || '{}') || {}; } catch (e) { active = {}; }

    function el(tag, cls, text) {
      var node = document.createElement(tag);
      if (cls) node.className = cls;
      if (text !== undefined) node.textContent = text;
      return node;
    }
    function prLink(pr) {
      var a = el('a', pr.state, '#' + pr.number);
      a.href = pr.url;
      a.target = '_blank';
      a.rel = 'noopener';
      var tags = [pr.state === 'open' ? (pr.draft ? '在途（草稿）' : '在途') : pr.state === 'merged' ? '已合并' : '已关闭未合并'];
      if (pr.plan) tags.push('方案');
      a.title = pr.title + '（' + tags.join('，') + '）';
      return a;
    }

    var when = new Date(data.generatedAt);
    var meta = document.getElementById('meta');
    meta.append('生成时间 ' + when.toLocaleString('zh-CN', { hour12: false }) + ' · 任务表来源 ');
    meta.append(el('code', '', data.sourceRef));
    meta.append(' · 状态由 PR 自动推导，Master Plan 不再手写进度');

    var summary = document.getElementById('summary');
    summary.append(el('span', 'big', data.percent + '%'));
    summary.append(el('span', '', '已完成 ' + data.counts['已完成'] + ' / ' + data.total + ' 个任务（已关闭的不计入）'));

    var bar = document.getElementById('bar');
    bar.setAttribute('aria-label', STATUSES.map(function (s) { return s + ' ' + data.counts[s]; }).join('，'));
    STATUSES.forEach(function (s) {
      if (!data.counts[s]) return;
      var seg = el('span');
      seg.style.width = (data.counts[s] / data.tasks.length * 100) + '%';
      seg.style.background = 'var(' + COLORS[s] + ')';
      seg.title = s + ' ' + data.counts[s];
      bar.append(seg);
    });

    var filters = document.getElementById('filters');
    STATUSES.forEach(function (s) {
      var chip = el('button', 'chip');
      chip.type = 'button';
      chip.id = 'filter-' + s;
      var dot = el('span', 'dot');
      dot.style.background = 'var(' + COLORS[s] + ')';
      chip.append(dot, s + ' ', el('span', 'num', String(data.counts[s])));
      chip.setAttribute('aria-pressed', active[s] ? 'true' : 'false');
      chip.addEventListener('click', function () {
        active[s] = !active[s];
        chip.setAttribute('aria-pressed', active[s] ? 'true' : 'false');
        try { localStorage.setItem('plan-progress-filter', JSON.stringify(active)); } catch (e) { /* 本机便利项，失败不影响显示 */ }
        render();
      });
      filters.append(chip);
    });

    function card(t) {
      var c = el('article', 'card s-' + t.status);
      var top = el('div', 'card-top');
      top.append(el('span', 'name', t.name), el('span', 'pill', t.status));
      c.append(top);
      if (t.reason) c.append(el('div', 'reason', t.reason));
      if (t.deps.length || t.depPrs.length) {
        var deps = el('div', 'row');
        deps.append(el('span', 'label', '依赖'));
        t.deps.forEach(function (d) {
          var met = byName[d] && byName[d].status === '已完成';
          deps.append(el('span', 'dep ' + (met ? 'ok' : 'no'), (met ? '✓ ' : '') + d));
        });
        t.depPrs.forEach(function (n) {
          var met = t.unmetDeps.indexOf('#' + n) < 0;
          deps.append(el('span', 'dep ' + (met ? 'ok' : 'no'), (met ? '✓ ' : '') + '#' + n));
        });
        c.append(deps);
      }
      var prs = el('div', 'row prs');
      prs.append(el('span', 'label', 'PR'));
      if (t.prs.length === 0) prs.append(el('span', 'label', '暂无'));
      t.prs.forEach(function (pr) { prs.append(prLink(pr)); });
      c.append(prs);
      var meta = el('div', 'row');
      meta.append(el('span', 'label', '风险 ' + (t.risk || '—') + ' · 规模 ' + (t.size || '—')));
      c.append(meta);
      var more = el('details');
      more.append(el('summary', '', '任务内容'), el('p', '', t.content));
      c.append(more);
      return c;
    }

    function render() {
      var anyActive = STATUSES.some(function (s) { return active[s]; });
      var root = document.getElementById('phases');
      root.replaceChildren();
      root.style.display = 'grid';
      root.style.gap = '28px';
      data.phases.forEach(function (phase) {
        var tasks = data.tasks.filter(function (t) { return t.phase === phase; });
        var shown = tasks.filter(function (t) { return !anyActive || active[t.status]; });
        var done = tasks.filter(function (t) { return t.status === '已完成'; }).length;
        var sec = el('section', 'phase');
        var head = el('div', 'phase-head');
        head.append(el('h2', '', phase), el('span', 'num', '完成 ' + done + ' / ' + tasks.length));
        sec.append(head);
        if (shown.length === 0) sec.append(el('div', 'empty', '这个阶段没有符合筛选条件的任务'));
        else {
          var grid = el('div', 'grid');
          shown.forEach(function (t) { grid.append(card(t)); });
          sec.append(grid);
        }
        root.append(sec);
      });
    }
    render();

    var un = document.getElementById('unplanned');
    var others = data.unplanned.filter(function (p) { return !p.planDoc; });
    var docs = data.unplanned.filter(function (p) { return p.planDoc; });
    un.append(el('h2', '', '计划外工作'));
    un.append(el('div', 'meta', data.since + ' 起合并进 staging、标题和正文都没有对上任务名的 PR：' + others.length + ' 个；规划文档同步 ' + docs.length + ' 个'));
    var det = el('details');
    det.append(el('summary', '', '展开列表'));
    var ul = el('ul');
    others.forEach(function (p) {
      var li = el('li');
      li.append(prLink(p), ' ' + p.title);
      ul.append(li);
    });
    det.append(ul);
    if (docs.length) {
      var dl = el('p', '');
      dl.append('规划文档：');
      docs.forEach(function (p) { dl.append(prLink(p), ' '); });
      det.append(dl);
    }
    un.append(det);

    if (data.warnings.length) {
      var w = document.getElementById('warnings');
      w.hidden = false;
      w.append(el('h2', '', '需要核对'));
      var wl = el('ul');
      data.warnings.forEach(function (m) { wl.append(el('li', '', m)); });
      w.append(wl);
    }
  })();
</script>
