<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Graylum Horizon Guide</title>
  <desc id="desc">A dark Graylum brand icon expressing light as guidance in grayness.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#050505"/>
      <stop offset="0.55" stop-color="#0B0B0B"/>
      <stop offset="1" stop-color="#151515"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="240" y1="160" x2="780" y2="880" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF1B0"/>
      <stop offset="0.42" stop-color="#F6C343"/>
      <stop offset="1" stop-color="#C57A16"/>
    </linearGradient>
    <linearGradient id="grayGrad" x1="160" y1="80" x2="820" y2="920" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B8B8B8"/>
      <stop offset="0.45" stop-color="#595959"/>
      <stop offset="1" stop-color="#242424"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(512 512) rotate(90) scale(420)">
      <stop offset="0" stop-color="#F6C343" stop-opacity="0.26"/>
      <stop offset="0.55" stop-color="#F6C343" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#F6C343" stop-opacity="0"/>
    </radialGradient>
    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="0" stdDeviation="26" flood-color="#F6C343" flood-opacity="0.5"/>
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#FFF0A2" flood-opacity="0.7"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="34" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

  </defs>
  <rect width="1024" height="1024" rx="224" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="1020" height="1020" rx="222" stroke="#2E2E2E" stroke-opacity="0.6" stroke-width="4"/>

  <circle cx="512" cy="512" r="400" fill="url(#halo)" opacity="0.7"/>
  <circle cx="512" cy="512" r="316" fill="#141414" stroke="#333333" stroke-width="18" filter="url(#softShadow)"/>
  <path d="M214 544 C306 493 414 467 512 467 C610 467 718 493 810 544" stroke="#6C6C6C" stroke-width="42" stroke-linecap="round" opacity="0.5"/>
  <path d="M290 640 C352 600 428 580 512 580 C596 580 672 600 734 640" stroke="#3E3E3E" stroke-width="34" stroke-linecap="round" opacity="0.7"/>
  <circle cx="512" cy="420" r="70" fill="url(#goldGrad)" filter="url(#goldGlow)"/>
  <path d="M512 500 L676 850 H348 Z" fill="url(#goldGrad)" opacity="0.96" filter="url(#goldGlow)"/>
  <path d="M512 530 L568 850 H456 Z" fill="#FFF4BD" opacity="0.88"/>
  <path d="M348 850 H676" stroke="#FFF1A6" stroke-width="24" stroke-linecap="round" opacity="0.85"/>

</svg>
