# Dependabot 配置文件
# 文档: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
# 最后扫描触发: 2026-01-26

version: 2
updates:
  # =====================================================
  # NPM 依赖更新 (根目录 - monorepo)
  # =====================================================
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    # 每周最多创建 10 个 PR
    open-pull-requests-limit: 10
    # 版本更新策略
    versioning-strategy: increase
    # 标签
    labels:
      - "dependencies"
      - "security"
    # 提交信息前缀
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    # 分组更新 (减少 PR 数量)
    groups:
      # 开发工具依赖分组
      dev-tools:
        patterns:
          - "@types/*"
          - "typescript"
          - "eslint*"
          - "prettier*"
          - "@typescript-eslint/*"
        update-types:
          - "minor"
          - "patch"
      # React 生态依赖分组
      react:
        patterns:
          - "react"
          - "react-dom"
          - "next"
          - "@next/*"
        update-types:
          - "minor"
          - "patch"
      # UI 组件依赖分组
      ui-components:
        patterns:
          - "@radix-ui/*"
          - "lucide-react"
          - "tailwindcss"
          - "class-variance-authority"
          - "clsx"
        update-types:
          - "minor"
          - "patch"
      # 数据库和 API 依赖分组
      database:
        patterns:
          - "@supabase/*"
          - "drizzle-*"
          - "@trpc/*"
        update-types:
          - "minor"
          - "patch"
      # 监控和日志依赖分组
      monitoring:
        patterns:
          - "@sentry/*"
          - "pino*"
        update-types:
          - "minor"
          - "patch"

  # =====================================================
  # GitHub Actions 更新
  # =====================================================
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci(deps)"
