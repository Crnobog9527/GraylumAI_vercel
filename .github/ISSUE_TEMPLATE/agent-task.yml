name: High-Risk Task
description: Create one bounded high-risk Task Envelope.
title: "[High-Risk Task] "
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: State the Owner-authorized outcome.
      placeholder: What must be true when this task is complete?
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: Risk
      description: State the risk class and production relevance.
      placeholder: Why is this high-risk, and is production affected?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: List the allowed files, modules, branches, services, and actions.
      placeholder: What is in scope for this one bounded envelope?
    validations:
      required: true
  - type: textarea
    id: forbidden
    attributes:
      label: Forbidden
      description: List actions, surfaces, environments, and systems that must not be touched.
      placeholder: What must remain outside this task?
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation
      description: List required tests, checks, review, staging evidence, and concrete NOT_APPLICABLE reasons.
      placeholder: How will the exact candidate be validated?
    validations:
      required: true
  - type: textarea
    id: external-systems
    attributes:
      label: External systems
      description: Identify affected providers, environments, data, or state, or state none.
      placeholder: Which external systems are in scope, if any?
    validations:
      required: true
  - type: textarea
    id: stop-conditions
    attributes:
      label: Stop conditions
      description: State the conditions that require a fresh Owner decision or fail-closed stop.
      placeholder: When must execution stop and return to the Owner?
    validations:
      required: true
