name: Agent Task
description: Create a bounded Agent Harness task.
title: "[Agent Task] "
labels:
  - agent-harness
body:
  - type: textarea
    id: owner-goal
    attributes:
      label: Owner goal
      description: Describe the business outcome or maintenance result.
      placeholder: What should be true when this task is complete?
    validations:
      required: true
  - type: dropdown
    id: risk-class
    attributes:
      label: Risk class
      options:
        - low
        - medium
        - high
        - production
    validations:
      required: true
  - type: textarea
    id: allowed-scope
    attributes:
      label: Allowed scope
      description: List files, modules, commands, or systems the agent may touch.
      placeholder: "Allowed files, branches, tests, and read-only services."
    validations:
      required: true
  - type: textarea
    id: forbidden-actions
    attributes:
      label: Forbidden actions
      description: List actions that must not be performed.
      value: |
        - No production deployment or production smoke.
        - No Supabase production DB access.
        - No Stripe live action.
        - No real checkout/payment/refund/cancel/webhook replay.
        - No Vercel/Supabase/Stripe env or project settings changes.
        - No uncontrolled DB migration/RPC/RLS/schema/grant changes.
        - No cron trigger.
        - No high-risk issue closure.
    validations:
      required: true
  - type: textarea
    id: expected-evidence
    attributes:
      label: Expected evidence
      description: List the validation, reports, screenshots, logs, or checks required.
      placeholder: "Contract, changed files, tests, evaluator report, release auditor report."
    validations:
      required: true
  - type: textarea
    id: production-relevance
    attributes:
      label: Production relevance
      description: Explain whether production is affected and what owner gate is required.
      placeholder: "No production relevance, or owner release gate required before production."
    validations:
      required: true
