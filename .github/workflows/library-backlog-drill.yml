# REL-1 core 7 (6): the library cleanup backlog drill (packages/db/tests/library/backlog-drill.mjs) on a clean runner.
# A loaded laptop measures its own load, not the cleanup batch, so the drill runs here. It never runs on pull requests or
# staging and is not a required check: push the commit to measure to drill/library-backlog (GitHub only fires
# workflow_dispatch from the default branch, main). Each scenario group builds its own empty database from the
# migration files; the numbers land in the job summary. Secretless and read-only like the rest of CI.
name: Library backlog drill

on:
  push:
    branches: [drill/library-backlog]
  workflow_dispatch:

concurrency:
  group: library-backlog-drill
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '24'

jobs:
  drill:
    name: Library backlog drill (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: bursts 1000 and 5000
            sizes: '1000,5000'
            only: 'starts|seeds|burst'
          - name: burst 12000
            sizes: '12000'
            only: 'starts|seeds|burst'
          - name: Storage outage 5000
            sizes: '1000'
            only: 'starts|seeds|Storage down'
          - name: late signed writes
            sizes: '1000'
            only: 'starts|seeds|late signed'
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run the drill
        env:
          LIBRARY_DRILL_SIZES: ${{ matrix.sizes }}
          LIBRARY_DRILL_ONLY: ${{ matrix.only }}
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/library-drill.txt"
          nproc; free -m
          LIBRARY_DRILL_OUT="$out" node packages/db/tests/library/backlog-drill.mjs -t "$LIBRARY_DRILL_ONLY"
          status=$?
          { echo '```'; cat "$out" 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
