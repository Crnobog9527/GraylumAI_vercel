# PR-safe security checks. This workflow never receives repository secrets.
name: Security Scan

on:
  pull_request:
    branches: [main, staging, develop]
  push:
    branches: [main, staging]
  schedule:
    - cron: '0 9 * * 1'

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run security audit
        run: pnpm audit --audit-level high

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@3c4e3dcb1aa7874d2c16be7d79418e9b7efd6261 # v4.8.2
        with:
          fail-on-severity: high

  workflow-policy:
    name: Workflow Policy Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve exact trusted base SHA
        id: trusted-base
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            trusted_sha="$PR_BASE_SHA"
          elif [ "${{ github.event_name }}" = "push" ]; then
            trusted_sha="$PUSH_BEFORE_SHA"
          else
            trusted_sha="${{ github.sha }}"
          fi
          if ! printf '%s' "$trusted_sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo 'Exact trusted base SHA is unavailable.'
            exit 1
          fi
          echo "sha=$trusted_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout trusted policy source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ steps.trusted-base.outputs.sha }}
          path: .trusted-base-policy
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/check-workflow-policy.rb
            .github/scripts/test-workflow-policy.rb

      - name: Require trusted policy source
        run: |
          test -f .trusted-base-policy/.github/scripts/check-workflow-policy.rb
          test -f .trusted-base-policy/.github/scripts/test-workflow-policy.rb

      - name: Run trusted workflow policy tests
        run: ruby .trusted-base-policy/.github/scripts/test-workflow-policy.rb

      - name: Check candidate workflows with trusted policy
        run: ruby .trusted-base-policy/.github/scripts/check-workflow-policy.rb .github/workflows

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve exact trusted base SHA
        id: trusted-base
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            trusted_sha="$PR_BASE_SHA"
          elif [ "${{ github.event_name }}" = "push" ]; then
            trusted_sha="$PUSH_BEFORE_SHA"
          else
            trusted_sha="${{ github.sha }}"
          fi
          if ! printf '%s' "$trusted_sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo 'Exact trusted base SHA is unavailable.'
            exit 1
          fi
          echo "sha=$trusted_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout trusted Gitleaks policy
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ steps.trusted-base.outputs.sha }}
          path: .trusted-base-gitleaks
          persist-credentials: false
          sparse-checkout: .gitleaks.toml

      - name: Require trusted Gitleaks policy
        run: test -f .trusted-base-gitleaks/.gitleaks.toml

      - name: Create scanner regression fixtures
        run: bash .github/scripts/create-secret-scan-regression-fixtures.sh .secret-scan-regression

      - name: Install checksum-pinned Gitleaks regression scanner
        run: |
          archive=/tmp/gitleaks_8.24.3_linux_x64.tar.gz
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            --output "$archive"
          echo '9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  /tmp/gitleaks_8.24.3_linux_x64.tar.gz' | sha256sum --check
          mkdir -p /tmp/gitleaks-bin
          tar -xzf "$archive" -C /tmp/gitleaks-bin gitleaks

      - name: Require scanner to reject docs and test fixtures
        run: |
          set +e
          /tmp/gitleaks-bin/gitleaks detect \
            --no-git \
            --source .secret-scan-regression \
            --config .trusted-base-gitleaks/.gitleaks.toml \
            --redact=100 \
            --report-format json \
            --report-path /tmp/secret-scan-regression.json
          scan_status=$?
          set -e
          if [ "$scan_status" -eq 0 ]; then
            echo 'Secret scanner failed to reject generated docs/test fixtures.'
            exit 1
          fi
          finding_count="$(jq 'length' /tmp/secret-scan-regression.json)"
          if [ "$finding_count" -lt 2 ]; then
            echo 'Secret scanner did not detect both generated regression fixtures.'
            exit 1
          fi
          echo "Secret scanner regression passed: rejected findings=$finding_count"

      - name: Remove scanner regression fixtures
        run: rm -rf .secret-scan-regression

      - name: Scan for exposed secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_CONFIG: .trusted-base-gitleaks/.gitleaks.toml
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'

  code-scan:
    name: Code Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Check tracked environment files
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.(local|development|production|test)$)'; then
            echo 'Tracked environment files are forbidden.'
            exit 1
          fi

  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript check
        run: pnpm --filter web typecheck

  security-unit-tests:
    name: Security Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run security tests
        run: pnpm --filter @repo/api test:run

  security-e2e-local:
    name: Security E2E Tests (secretless local)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      NEXT_PUBLIC_APP_URL: https://ci.graylum.example
      OPENROUTER_API_KEY: sk-or-security-e2e-placeholder-local-runtime-only
      SECURITY_E2E_LOCAL_ONLY: 'true'
      E2E_ALLOW_DATABASE_FIXTURES: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: cd apps/web && npx playwright install --with-deps chromium

      - name: Build application
        run: pnpm turbo build

      - name: Start application
        run: |
          cd apps/web
          pnpm start > /tmp/graylum-security-e2e.log 2>&1 &
          echo $! > /tmp/graylum-security-e2e.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/login >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo 'Application failed to start.'
          exit 1

      - name: Run secretless local E2E
        run: |
          set +e
          cd apps/web
          PLAYWRIGHT_JSON_OUTPUT_FILE=/tmp/security-e2e-results.json \
            npx playwright test security.spec.ts --project=chromium --reporter=json
          test_status=$?
          cd ../..
          set -e
          node .github/scripts/check-playwright-results.cjs /tmp/security-e2e-results.json --allow-skipped
          exit "$test_status"
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000

      - name: Stop application
        if: always()
        run: |
          if [ -f /tmp/graylum-security-e2e.pid ]; then
            kill "$(cat /tmp/graylum-security-e2e.pid)" || true
          fi

      # Reports are intentionally not uploaded: they can contain browser storage or user data.
