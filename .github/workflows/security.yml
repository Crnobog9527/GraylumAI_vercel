# Secretless repository security checks and transitional local E2E evidence.
name: Security Scan

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]
  schedule:
    - cron: '0 9 * * 1'

permissions:
  contents: read

jobs:
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          # Intentionally absent: cache: pnpm.
          # "Setup audit-compatible pnpm" below swaps the active pnpm version and
          # package_json_file, which changes the resolved pnpm store path. The
          # setup-node post step then tries to save a store path that no longer
          # exists and fails the whole job ("Path Validation Error"), even when
          # "Run security audit" succeeded. This job audits a lockfile copy in
          # RUNNER_TEMP and does not benefit from the store cache.

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup audit-compatible pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.13.0
          # Intentionally absent: isolate the audit CLI from the repository's install-time pnpm version.
          package_json_file: .github/pnpm-audit-toolchain.json

      - name: Prepare isolated audit input
        run: |
          set -euo pipefail
          audit_dir="$RUNNER_TEMP/graylum-pnpm-audit"
          rm -rf -- "$audit_dir"
          mkdir -p "$audit_dir"
          cp pnpm-lock.yaml "$audit_dir/pnpm-lock.yaml"

      - name: Run security audit
        working-directory: ${{ runner.temp }}/graylum-pnpm-audit
        run: pnpm audit --audit-level high

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@3c4e3dcb1aa7874d2c16be7d79418e9b7efd6261 # v4.8.2
        with:
          fail-on-severity: high

  workflow-policy:
    name: Workflow Policy Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout candidate
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve exact trusted policy SHA
        id: trusted-ref
        shell: bash
        run: |
          set -euo pipefail
          # Human-maintained immutable bootstrap base. It contains every trusted
          # policy material required by this workflow.
          bootstrap_sha='2331a1f64794cc85b9ae5539930e13e7bd48f211'
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              trusted_sha="$(jq -er '.pull_request.base.sha' "$GITHUB_EVENT_PATH")"
              ;;
            push)
              trusted_sha="$(jq -er '.before' "$GITHUB_EVENT_PATH")"
              ;;
            schedule)
              trusted_sha="$GITHUB_SHA"
              ;;
            *)
              echo 'Unsupported workflow event.'
              exit 1
              ;;
          esac
          if ! printf '%s' "$trusted_sha" | grep -Eq '^[0-9a-f]{40}$' ||
            printf '%s' "$trusted_sha" | grep -Eq '^0{40}$'; then
            echo 'Exact trusted policy SHA is unavailable.'
            exit 1
          fi
          if ! git cat-file -e "${trusted_sha}^{commit}" 2>/dev/null; then
            echo "Trusted policy commit is unavailable: $trusted_sha"
            exit 1
          fi
          original_trusted_sha="$trusted_sha"
          missing_materials=()
          for material in \
            .github/scripts/check-workflow-policy.rb \
            .github/scripts/test-workflow-policy.rb \
            .github/scripts/create-secret-scan-regression-fixtures.sh \
            .gitleaks.toml; do
            if ! git cat-file -e "${trusted_sha}:${material}" 2>/dev/null; then
              missing_materials+=("$material")
            fi
          done
          if [ "${#missing_materials[@]}" -gt 0 ]; then
            if git merge-base --is-ancestor "$bootstrap_sha" "$trusted_sha"; then
              printf 'Trusted policy source rejected: trusted SHA=%s is later than the trusted bootstrap baseline; missing material(s) treated as deletion: %s\n' \
                "$original_trusted_sha" "${missing_materials[*]}" >&2
              exit 1
            fi
            printf 'Trusted policy source fallback: original trusted SHA=%s; missing material(s): %s; bootstrap SHA=%s\n' \
              "$original_trusted_sha" "${missing_materials[*]}" "$bootstrap_sha"
            trusted_sha="$bootstrap_sha"
          else
            echo "Trusted policy source: base commit SHA=$trusted_sha (source=trusted base)"
          fi
          git cat-file -e "${trusted_sha}^{commit}"
          echo "sha=$trusted_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout trusted policy source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ steps.trusted-ref.outputs.sha }}
          path: .trusted-base-policy
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/scripts/check-workflow-policy.rb
            .github/scripts/test-workflow-policy.rb
            .github/scripts/create-secret-scan-regression-fixtures.sh

      - name: Require trusted policy source
        run: |
          set -euo pipefail
          test -f .trusted-base-policy/.github/scripts/check-workflow-policy.rb
          test -f .trusted-base-policy/.github/scripts/test-workflow-policy.rb
          test -f .trusted-base-policy/.github/scripts/create-secret-scan-regression-fixtures.sh

      - name: Run trusted workflow policy regression tests
        run: ruby .trusted-base-policy/.github/scripts/test-workflow-policy.rb

      - name: Check candidate workflow allowlist
        run: |
          set -euo pipefail
          candidate_dir="$(mktemp -d "$RUNNER_TEMP/graylum-candidate-workflows.XXXXXX")"
          trap 'rm -rf -- "$candidate_dir"' EXIT
          cp .github/workflows/ci.yml "$candidate_dir/ci.yml"
          cp .github/workflows/security.yml "$candidate_dir/security.yml"
          cp .github/workflows/codeql.yml "$candidate_dir/codeql.yml"
          test "$(find "$candidate_dir" -maxdepth 1 -type f | wc -l | tr -d ' ')" -eq 3
          ruby .trusted-base-policy/.github/scripts/check-workflow-policy.rb "$candidate_dir"

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout candidate history
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve trusted source and scan range
        id: event-range
        shell: bash
        run: |
          set -euo pipefail
          # Human-maintained immutable bootstrap base. It contains every trusted
          # policy material required by this workflow.
          bootstrap_sha='2331a1f64794cc85b9ae5539930e13e7bd48f211'
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              trusted_sha="$(jq -er '.pull_request.base.sha' "$GITHUB_EVENT_PATH")"
              scan_from="$trusted_sha"
              scan_to="$(jq -er '.pull_request.head.sha' "$GITHUB_EVENT_PATH")"
              ;;
            push)
              trusted_sha="$(jq -er '.before' "$GITHUB_EVENT_PATH")"
              scan_from="$trusted_sha"
              scan_to="$(jq -er '.after' "$GITHUB_EVENT_PATH")"
              ;;
            schedule)
              trusted_sha="$GITHUB_SHA"
              scan_to="$GITHUB_SHA"
              scan_from="$(git rev-parse "${GITHUB_SHA}^")"
              ;;
            *)
              echo 'Unsupported workflow event.'
              exit 1
              ;;
          esac
          if ! printf '%s' "$trusted_sha" | grep -Eq '^[0-9a-f]{40}$' ||
            printf '%s' "$trusted_sha" | grep -Eq '^0{40}$'; then
            echo 'Exact trusted policy SHA is unavailable.'
            exit 1
          fi
          if ! git cat-file -e "${trusted_sha}^{commit}" 2>/dev/null; then
            echo "Trusted policy commit is unavailable: $trusted_sha"
            exit 1
          fi
          original_trusted_sha="$trusted_sha"
          missing_materials=()
          for material in \
            .github/scripts/check-workflow-policy.rb \
            .github/scripts/test-workflow-policy.rb \
            .github/scripts/create-secret-scan-regression-fixtures.sh \
            .gitleaks.toml; do
            if ! git cat-file -e "${trusted_sha}:${material}" 2>/dev/null; then
              missing_materials+=("$material")
            fi
          done
          if [ "${#missing_materials[@]}" -gt 0 ]; then
            if git merge-base --is-ancestor "$bootstrap_sha" "$trusted_sha"; then
              printf 'Trusted policy source rejected: trusted SHA=%s is later than the trusted bootstrap baseline; missing material(s) treated as deletion: %s\n' \
                "$original_trusted_sha" "${missing_materials[*]}" >&2
              exit 1
            fi
            printf 'Trusted policy source fallback: original trusted SHA=%s; missing material(s): %s; bootstrap SHA=%s\n' \
              "$original_trusted_sha" "${missing_materials[*]}" "$bootstrap_sha"
            trusted_sha="$bootstrap_sha"
          else
            echo "Trusted policy source: base commit SHA=$trusted_sha (source=trusted base)"
          fi
          for sha in "$trusted_sha" "$scan_from" "$scan_to"; do
            if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$' ||
              printf '%s' "$sha" | grep -Eq '^0{40}$'; then
              echo 'A required exact commit SHA is unavailable.'
              exit 1
            fi
            git cat-file -e "${sha}^{commit}"
          done
          echo "trusted-sha=$trusted_sha" >> "$GITHUB_OUTPUT"
          echo "scan-from=$scan_from" >> "$GITHUB_OUTPUT"
          echo "scan-to=$scan_to" >> "$GITHUB_OUTPUT"

      - name: Checkout trusted Gitleaks material
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ steps.event-range.outputs.trusted-sha }}
          path: .trusted-base-gitleaks
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .gitleaks.toml
            .github/scripts/create-secret-scan-regression-fixtures.sh

      - name: Require trusted Gitleaks material
        run: |
          set -euo pipefail
          test -f .trusted-base-gitleaks/.gitleaks.toml
          test -f .trusted-base-gitleaks/.github/scripts/create-secret-scan-regression-fixtures.sh

      - name: Install checksum-verified Gitleaks
        id: gitleaks
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_8.24.3_linux_x64.tar.gz"
          binary_dir="$RUNNER_TEMP/gitleaks-bin"
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' \
            '9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c' \
            "$archive" | sha256sum --check
          mkdir -p "$binary_dir"
          tar -xzf "$archive" -C "$binary_dir" gitleaks
          echo "binary=$binary_dir/gitleaks" >> "$GITHUB_OUTPUT"

      - name: Require trusted regression fixtures to be rejected
        env:
          GITLEAKS_BINARY: ${{ steps.gitleaks.outputs.binary }}
        run: |
          set -euo pipefail
          export TMPDIR="$RUNNER_TEMP"
          fixture_root="$RUNNER_TEMP/graylum-secret-scan-fixtures.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}.${RANDOM}"
          report_path="$RUNNER_TEMP/gitleaks-fixture-report.json"
          trap 'rm -rf -- "$fixture_root" "$report_path"' EXIT
          bash .trusted-base-gitleaks/.github/scripts/create-secret-scan-regression-fixtures.sh "$fixture_root"
          set +e
          "$GITLEAKS_BINARY" detect \
            --no-git \
            --source "$fixture_root" \
            --config .trusted-base-gitleaks/.gitleaks.toml \
            --redact=100 \
            --report-format json \
            --report-path "$report_path"
          scan_status=$?
          set -e
          if [ "$scan_status" -ne 1 ]; then
            echo 'Trusted secret fixtures were not rejected deterministically.'
            exit 1
          fi
          detected_files="$(jq '[.[].File] | unique | length' "$report_path")"
          if [ "$detected_files" -ne 6 ]; then
            echo 'Trusted secret regression did not cover all generated fixture files.'
            exit 1
          fi
          echo 'Trusted secret regression rejected all generated fixture files.'

      - name: Scan replacement commit range
        env:
          GITLEAKS_BINARY: ${{ steps.gitleaks.outputs.binary }}
          SCAN_FROM: ${{ steps.event-range.outputs.scan-from }}
          SCAN_TO: ${{ steps.event-range.outputs.scan-to }}
        run: |
          set -euo pipefail
          report_path="$RUNNER_TEMP/gitleaks-replacement-report.json"
          trap 'rm -f -- "$report_path"' EXIT
          set +e
          "$GITLEAKS_BINARY" git . \
            --log-opts="$SCAN_FROM..$SCAN_TO" \
            --config .trusted-base-gitleaks/.gitleaks.toml \
            --redact=100 \
            --report-format json \
            --report-path "$report_path"
          scan_status=$?
          set -e
          if [ "$scan_status" -ne 0 ]; then
            echo 'Secret scan rejected the replacement commit range or failed closed.'
            exit "$scan_status"
          fi
          echo 'Replacement commit range secret scan passed.'

  code-scan:
    name: Code Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Reject tracked environment files
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)\.env($|\.)' | \
            grep -Ev '(^|/)\.env\.(example|sample|template)$'; then
            echo 'Tracked environment files are forbidden.'
            exit 1
          fi
          echo 'No tracked sensitive environment files found.'

  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript check
        run: pnpm --filter web typecheck

  security-unit-tests:
    name: Security Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run security tests
        run: pnpm --filter @repo/api test:run

  security-e2e-tests:
    name: Security E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://local.invalid
      NEXT_PUBLIC_SUPABASE_ANON_KEY: local-noncredential-value-local-noncredential-value-local-noncredential-value-local-noncredential-value
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      OPENROUTER_API_KEY: disabled-local-runtime
      SECURITY_E2E_LOCAL_ONLY: 'true'
      E2E_ALLOW_DATABASE_FIXTURES: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: cd apps/web && pnpm exec playwright install --with-deps chromium

      - name: Build application
        run: pnpm build

      - name: Start application
        run: |
          set -euo pipefail
          cd apps/web
          pnpm start > "$RUNNER_TEMP/graylum-security-e2e.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/graylum-security-e2e.pid"
          for _ in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/login > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo 'Application failed to start for secretless E2E.'
          exit 1

      - name: Run transitional secretless Security E2E
        env:
          CI: 'true'
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
        run: |
          set +e
          cd apps/web
          PLAYWRIGHT_JSON_OUTPUT_FILE="$RUNNER_TEMP/security-e2e-results.json" \
            pnpm exec playwright test security.spec.ts --project=chromium --reporter=json
          playwright_status=$?
          cd ../..
          set -e
          node .github/scripts/check-playwright-results.cjs \
            "$RUNNER_TEMP/security-e2e-results.json" \
            --allow-skipped
          if [ "$playwright_status" -ne 0 ]; then
            exit "$playwright_status"
          fi

      - name: Stop application
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/graylum-security-e2e.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/graylum-security-e2e.pid")"
          fi

      # Browser reports, storage state, traces, videos, and screenshots are intentionally not uploaded.
