# 安全扫描工作流
# 在 PR 和 push 时运行安全检查

name: Security Scan

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]
  schedule:
    # 每周一 9:00 UTC 运行
    - cron: '0 9 * * 1'

jobs:
  # 依赖安全审计
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # 自动从 package.json 的 packageManager 字段读取版本

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run security audit
        run: |
          echo "## 依赖安全审计报告" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # 运行审计并捕获输出
          AUDIT_OUTPUT=$(pnpm audit --json 2>/dev/null || true)

          # 统计漏洞数量
          CRITICAL=$(echo "$AUDIT_OUTPUT" | jq -r '.metadata.vulnerabilities.critical // 0')
          HIGH=$(echo "$AUDIT_OUTPUT" | jq -r '.metadata.vulnerabilities.high // 0')
          MODERATE=$(echo "$AUDIT_OUTPUT" | jq -r '.metadata.vulnerabilities.moderate // 0')
          LOW=$(echo "$AUDIT_OUTPUT" | jq -r '.metadata.vulnerabilities.low // 0')

          echo "| 严重程度 | 数量 |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| Critical | $CRITICAL |" >> $GITHUB_STEP_SUMMARY
          echo "| High | $HIGH |" >> $GITHUB_STEP_SUMMARY
          echo "| Moderate | $MODERATE |" >> $GITHUB_STEP_SUMMARY
          echo "| Low | $LOW |" >> $GITHUB_STEP_SUMMARY

          # 如果有高危或严重漏洞，标记为失败
          if [ "$CRITICAL" -gt 0 ] || [ "$HIGH" -gt 0 ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "❌ 发现高危漏洞，请尽快修复！" >> $GITHUB_STEP_SUMMARY
            pnpm audit
            exit 1
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ 没有发现高危漏洞" >> $GITHUB_STEP_SUMMARY
          fi

  # 代码安全扫描
  code-scan:
    name: Code Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for hardcoded secrets
        run: |
          echo "## 硬编码密钥检查" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # 检查 Anthropic API key
          if grep -rn "sk-ant-api" --include="*.ts" --include="*.tsx" --include="*.js" --include="*.jsx" . 2>/dev/null | grep -v ".example" | grep -v "test" | grep -v "pattern"; then
            echo "❌ 发现可能的 Anthropic API key 硬编码" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          # 检查 Supabase key
          if grep -rn "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9" --include="*.ts" --include="*.tsx" --include="*.js" --include="*.jsx" . 2>/dev/null | grep -v ".example" | grep -v "test"; then
            echo "❌ 发现可能的 JWT token 硬编码" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          echo "✅ 未发现硬编码密钥" >> $GITHUB_STEP_SUMMARY

      - name: Check .env files not committed
        run: |
          echo "## 环境文件检查" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # 检查是否有 .env 文件被提交
          if git ls-files | grep -E "^\.env$|\.env\.local$|\.env\.[^example]"; then
            echo "❌ 检测到 .env 文件被提交到仓库" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          echo "✅ 没有敏感环境文件被提交" >> $GITHUB_STEP_SUMMARY

  # TypeScript 类型检查
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # 自动从 package.json 的 packageManager 字段读取版本

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript check
        run: pnpm turbo typecheck || true
