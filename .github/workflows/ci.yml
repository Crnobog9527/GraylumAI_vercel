# CI quality checks. Pull-request execution is secretless and read-only.
name: CI

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

permissions:
  contents: read

env:
  NODE_VERSION: '24'

jobs:
  lint-and-type:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm --filter web lint

      - name: Run TypeScript check
        run: pnpm --filter web typecheck

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run API tests
        run: pnpm test:api

      - name: Launch regression — auth bootstrap including OAuth
        run: pnpm test:ci:auth-bootstrap

      - name: Launch regression — checkout readiness, cancellation, and PAY-1
        run: pnpm test:ci:checkout-cancellation

      - name: Launch regression — PAY-1 frontend checkout readiness and cancellation
        run: pnpm test:ci:pay-1-frontend

      - name: Launch regression — Skill runtime active and unbound fail-closed
        run: pnpm test:ci:skill-runtime

      - name: Launch regression — YEAR-1 calendar grants
        run: pnpm test:ci:year-calendar

      - name: Launch regression — REFUND-1B counters and race protections
        run: pnpm test:ci:refund-race

      - name: Launch regression — billing cron authorization and reconciliation
        run: pnpm test:ci:billing-cron

      - name: Launch regression — proxy hostname behavior
        run: pnpm test:ci:proxy-hostname

      - name: CI safeguards — migration ledger and db push guard
        run: pnpm test:ci:safeguards

      - name: CI safeguard — check migration ledger
        run: node scripts/check-migration-ledger.mjs

  build:
    name: Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [lint-and-type]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://local.invalid
          NEXT_PUBLIC_SUPABASE_ANON_KEY: local-noncredential-value
