# CI quality checks. Pull-request execution is secretless and read-only.
name: CI

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

  schedule:
    - cron: '0 9 * * 1'

permissions:
  contents: read

env:
  NODE_VERSION: '24'

jobs:
  lint-and-type:
    name: Run lint and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm --filter web lint

      - name: Run TypeScript check
        run: pnpm --filter web typecheck

  test:
    name: Run unit and regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Test required-check contracts
        run: ruby .github/scripts/test-ci-workflows.rb

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: CI safeguard — check migration ledger
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              migration_base_sha="$(jq -er '.pull_request.base.sha' "$GITHUB_EVENT_PATH")"
              ;;
            push)
              migration_base_sha="$(jq -er '.before' "$GITHUB_EVENT_PATH")"
              ;;
            schedule)
              migration_base_sha="$GITHUB_SHA"
              ;;
            *)
              echo 'Unsupported workflow event for migration ledger check.' >&2
              exit 1
              ;;
          esac
          if ! printf '%s' "$migration_base_sha" | grep -Eq '^[0-9a-f]{40}$' ||
            printf '%s' "$migration_base_sha" | grep -Eq '^0{40}$' ||
            ! git cat-file -e "${migration_base_sha}^{commit}" 2>/dev/null; then
            echo 'Exact migration base commit is unavailable.' >&2
            exit 1
          fi

          if git cat-file -e "${migration_base_sha}:scripts/check-migration-ledger.mjs" 2>/dev/null; then
            trusted_checker="$RUNNER_TEMP/graylum-check-migration-ledger.mjs"
            git show "${migration_base_sha}:scripts/check-migration-ledger.mjs" > "$trusted_checker"
            echo 'Using migration ledger checker from the exact base commit.'
            if [ "$GITHUB_EVENT_NAME" = schedule ]; then
              # The frozen checker CLI accepts PR/push events only. Its exported
              # validator accepts the exact schedule commit without weakening it.
              node --input-type=module -e '
                import { pathToFileURL } from "node:url";
                const { checkMigrationLedger } = await import(pathToFileURL(process.argv[2]).href);
                const errors = await checkMigrationLedger("packages/db/migrations", {
                  baseSha: process.argv[3], repositoryRoot: process.cwd(),
                });
                for (const error of errors) console.error(`Migration ledger check failed: ${error}`);
                if (errors.length) process.exit(1);
                console.log("Migration ledger check passed.");
              ' -- schedule-ledger "$trusted_checker" "$migration_base_sha"
            else
              node "$trusted_checker"
            fi
          else
            echo 'Bootstrapping the migration ledger checker; base-existing migrations must be unchanged.'
            checker_index_entry="$(git ls-files --stage -- scripts/check-migration-ledger.mjs)"
            checker_mode="${checker_index_entry%% *}"
            if [ -z "$checker_index_entry" ] || [ -L scripts/check-migration-ledger.mjs ] ||
              [ ! -f scripts/check-migration-ledger.mjs ]; then
              echo 'Bootstrap migration ledger checker must be a tracked regular file.' >&2
              exit 1
            fi
            case "$checker_mode" in
              100644|100755) ;;
              *)
                echo 'Bootstrap migration ledger checker has an unsupported Git mode.' >&2
                exit 1
                ;;
            esac
            expected_checker_sha='f7b64010de1ffb58c4910bb74aee431e1d2273249257ba8cb1dcbc8b0d2a1f07'
            actual_checker_sha="$(sha256sum scripts/check-migration-ledger.mjs | awk '{print $1}')"
            if [ "$actual_checker_sha" != "$expected_checker_sha" ]; then
              echo 'Bootstrap migration ledger checker does not match the reviewed content.' >&2
              exit 1
            fi
            git diff --quiet --no-ext-diff --no-textconv --no-renames \
              --diff-filter=MDTUXB "$migration_base_sha" -- packages/db/migrations
            node scripts/check-migration-ledger.mjs
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run API tests
        run: pnpm test:api

      - name: Launch regression — PAY-1 frontend checkout readiness and cancellation
        run: pnpm test:ci:pay-1-frontend

      - name: Launch regression — billing cron authorization and reconciliation
        run: pnpm --filter web exec vitest run src/app/api/cron/billing-reconcile/route.test.ts

      - name: Launch regression — proxy hostname behavior
        run: pnpm test:ci:proxy-hostname

      - name: CI safeguards — migration ledger and db push guard
        run: pnpm test:ci:safeguards

  build-and-e2e:
    name: Run build and secretless security E2E
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://local.invalid
      NEXT_PUBLIC_SUPABASE_ANON_KEY: local-noncredential-value-local-noncredential-value-local-noncredential-value-local-noncredential-value
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      OPENROUTER_API_KEY: disabled-local-runtime
      SECURITY_E2E_LOCAL_ONLY: 'true'
      E2E_ALLOW_DATABASE_FIXTURES: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        id: build-node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve cache ref scope
        id: cache-scope
        run: |
          set -euo pipefail
          printf 'workflow=%s\n' "$(sha256sum .github/workflows/ci.yml | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          printf 'ref=%s\n' "$(printf '%s' "$GITHUB_REF" | sha256sum | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      # Cache compiler state only, never build outputs or test results. Scope to
      # this ref and the exact toolchain/config; Next still checks changed inputs.
      - name: Cache Next.js build state
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: apps/web/.next/cache
          key: secretless-next-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.build-node.outputs.node-version }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json', 'apps/*/package.json', 'packages/*/package.json', 'apps/*/tsconfig*.json', 'packages/tsconfig/*.json', 'apps/web/next.config.*', 'apps/web/postcss.config.*', 'turbo.json') }}-${{ steps.cache-scope.outputs.workflow }}-${{ steps.cache-scope.outputs.ref }}-${{ github.sha }}
          restore-keys: |
            secretless-next-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.build-node.outputs.node-version }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json', 'apps/*/package.json', 'packages/*/package.json', 'apps/*/tsconfig*.json', 'packages/tsconfig/*.json', 'apps/web/next.config.*', 'apps/web/postcss.config.*', 'turbo.json') }}-${{ steps.cache-scope.outputs.workflow }}-${{ steps.cache-scope.outputs.ref }}-

      - name: Install Playwright browser
        run: cd apps/web && pnpm exec playwright install --with-deps --only-shell chromium

      - name: Build application
        run: pnpm build

      - name: Start application
        run: |
          set -euo pipefail
          cd apps/web
          pnpm start > "$RUNNER_TEMP/graylum-security-e2e.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/graylum-security-e2e.pid"
          for _ in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/login > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo 'Application failed to start for secretless E2E.'
          exit 1

      - name: Run transitional secretless Security E2E
        env:
          CI: 'true'
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
        run: |
          set +e
          cd apps/web
          PLAYWRIGHT_JSON_OUTPUT_FILE="$RUNNER_TEMP/security-e2e-results.json" \
            pnpm exec playwright test security.spec.ts --project=chromium --reporter=json
          playwright_status=$?
          cd ../..
          set -e
          node .github/scripts/check-playwright-results.cjs \
            "$RUNNER_TEMP/security-e2e-results.json" \
            --allow-skipped
          if [ "$playwright_status" -ne 0 ]; then
            exit "$playwright_status"
          fi

      - name: Stop application
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/graylum-security-e2e.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/graylum-security-e2e.pid")"
          fi

      # Browser reports, storage state, traces, videos, and screenshots are intentionally not uploaded.

  lint-check:
    name: Lint & Type Check
    needs: [lint-and-type]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require successful worker validation
        env:
          WORK_RESULT: ${{ needs.lint-and-type.result }}
        run: |
          set -euo pipefail
          if [ "$WORK_RESULT" != success ]; then
            echo 'Missing, failed, cancelled, or skipped validation.' >&2
            exit 1
          fi
          echo 'Validation passed.'

  typecheck:
    name: TypeScript Check
    needs: [lint-and-type]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require successful worker validation
        env:
          WORK_RESULT: ${{ needs.lint-and-type.result }}
        run: |
          set -euo pipefail
          if [ "$WORK_RESULT" != success ]; then
            echo 'Missing, failed, cancelled, or skipped validation.' >&2
            exit 1
          fi
          echo 'Validation passed.'

  unit-check:
    name: Unit Tests
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require successful worker validation
        env:
          WORK_RESULT: ${{ needs.test.result }}
        run: |
          set -euo pipefail
          if [ "$WORK_RESULT" != success ]; then
            echo 'Missing, failed, cancelled, or skipped validation.' >&2
            exit 1
          fi
          echo 'Validation passed.'

  security-unit-tests:
    name: Security Unit Tests
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require successful worker validation
        env:
          WORK_RESULT: ${{ needs.test.result }}
        run: |
          set -euo pipefail
          if [ "$WORK_RESULT" != success ]; then
            echo 'Missing, failed, cancelled, or skipped validation.' >&2
            exit 1
          fi
          echo 'Validation passed.'

  build:
    name: Build Check
    needs: [build-and-e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require successful worker validation
        env:
          WORK_RESULT: ${{ needs.build-and-e2e.result }}
        run: |
          set -euo pipefail
          if [ "$WORK_RESULT" != success ]; then
            echo 'Missing, failed, cancelled, or skipped validation.' >&2
            exit 1
          fi
          echo 'Validation passed.'

  security-e2e-tests:
    name: Security E2E Tests
    needs: [build-and-e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require successful worker validation
        env:
          WORK_RESULT: ${{ needs.build-and-e2e.result }}
        run: |
          set -euo pipefail
          if [ "$WORK_RESULT" != success ]; then
            echo 'Missing, failed, cancelled, or skipped validation.' >&2
            exit 1
          fi
          echo 'Validation passed.'
